name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 브랜치별로 최신 실행만 남긴다 — 뒤이은 커밋이 앞선 검증 결과를 무의미하게 만든다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 기본 토큰 권한을 읽기로 좁힌다 — 이 워크플로는 아무것도 쓰지 않는다.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install 과 달리 lock 을 고쳐 쓰지 않는다 — 로컬과 같은 의존 트리를 보장한다.
      - run: npm ci

      # npm run ci 와 같은 순서를 단계로 쪼갠다 — 어느 게이트가 깨졌는지 UI 에서 바로 보인다.
      - run: npm run fsd
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test

      # tests/integration 은 로컬 도커 Supabase 를 요구해 vitest.config.ts 가 이미 제외한다.
      # build 는 generateStaticParams 가 실제 Supabase 를 읽으므로 공개 env 두 개가 필요하다.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
