<!DOCTYPE html>
<html lang="ko" class="theme-spring">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>임재준 | 지식 모음 — Material UI Kit</title>
<link rel="stylesheet" href="kit.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { SEASONS } = window.KitData;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "season": "spring",
  "corner": "default",
  "elevation": "soft"
}/*EDITMODE-END*/;

// Corner-style variations override the MD3 shape scale on :root.
const CORNERS = {
  sharp:   { es: '0', sm: '2px', md: '4px', lg: '6px', xl: '10px' },
  default: null,
  rounded: { es: '8px', sm: '14px', md: '20px', lg: '26px', xl: '36px' },
};
const ELEVATIONS = {
  flat: ['none','0 0 0 1px var(--md-sys-color-outline-variant)','0 0 0 1px var(--md-sys-color-outline-variant)','0 1px 2px rgba(0,0,0,.2)','0 1px 2px rgba(0,0,0,.2)','0 2px 4px rgba(0,0,0,.2)'],
  soft: null,
  strong: ['none','0 2px 4px rgba(0,0,0,.34),0 1px 3px 1px rgba(0,0,0,.2)','0 3px 8px rgba(0,0,0,.34),0 3px 10px 2px rgba(0,0,0,.2)','0 5px 12px rgba(0,0,0,.34),0 6px 14px 3px rgba(0,0,0,.2)','0 7px 16px rgba(0,0,0,.34),0 10px 20px 5px rgba(0,0,0,.2)','0 10px 22px rgba(0,0,0,.34),0 14px 28px 8px rgba(0,0,0,.2)'],
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const season = t.season;
  const setSeason = (s) => setTweak('season', s);
  const [route, setRoute] = React.useState('home');
  const [post, setPost] = React.useState(null);
  const [scrolled, setScrolled] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [snack, setSnack] = React.useState(null);

  // Apply the active season class to <html> — the single switch that reskins everything.
  React.useEffect(() => {
    const cls = SEASONS.find((s) => s.key === season).cls;
    document.documentElement.className = cls;
  }, [season]);

  // Apply component-style variations (corner radius + elevation) as inline var overrides.
  React.useEffect(() => {
    const el = document.documentElement;
    const c = CORNERS[t.corner];
    const map = { 'extra-small': c && c.es, 'small': c && c.sm, 'medium': c && c.md, 'large': c && c.lg, 'extra-large': c && c.xl };
    Object.entries(map).forEach(([k, v]) => {
      if (v) el.style.setProperty('--md-sys-shape-corner-' + k, v);
      else el.style.removeProperty('--md-sys-shape-corner-' + k);
    });
    const e = ELEVATIONS[t.elevation];
    for (let i = 0; i <= 5; i++) {
      if (e) el.style.setProperty('--md-sys-elevation-' + i, e[i]);
      else el.style.removeProperty('--md-sys-elevation-' + i);
    }
  }, [t.corner, t.elevation]);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const showSnack = (msg) => { setSnack(msg); clearTimeout(window.__st); window.__st = setTimeout(() => setSnack(null), 2600); };
  const nav = (r) => { setRoute(r); window.scrollTo(0, 0); };
  const openPost = (p) => { setPost(p); setRoute('post'); window.scrollTo(0, 0); };

  return (
    <React.Fragment>
      <AppBar route={route} scrolled={scrolled} onNav={nav}
        onSearch={() => nav('search')} season={season} onSeason={setSeason} />

      <main className="shell">
        {route === 'home' && <Home onOpen={openPost} onNav={nav} />}
        {route === 'blog' && <Blog onOpen={openPost} />}
        {route === 'search' && <Search onOpen={openPost} />}
        {route === 'about' && <About />}
        {route === 'post' && post && <Post post={post} onBack={() => nav('blog')} onSnack={showSnack} />}
      </main>

      {snack && (
        <div className="snackbar-host">
          <div className="snackbar">{snack}<button className="action" onClick={() => setSnack(null)}>닫기</button></div>
        </div>
      )}

      <TweaksPanel>
        <TweakSection label="컴포넌트 스타일" />
        <TweakRadio label="모서리" value={t.corner}
          options={['sharp', 'default', 'rounded']}
          onChange={(v) => setTweak('corner', v)} />
        <TweakRadio label="Elevation" value={t.elevation}
          options={['flat', 'soft', 'strong']}
          onChange={(v) => setTweak('elevation', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
